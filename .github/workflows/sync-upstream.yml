name: Sync upstream CLIProxyAPI main

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches: [patched]
    paths:
      - .github/workflows/sync-upstream.yml
      - .github/scripts/sync_upstream.sh

concurrency:
  group: sync-upstream-cliproxyapi
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check upstream main and merge into the custom fork
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/sync_upstream.sh
