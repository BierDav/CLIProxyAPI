# fork-kit (https://github.com/BierDav/fork-kit) keeps this fork merged with
# upstream through one sync pull request. See docs/custom-fork.md.

[upstream]
url = "https://github.com/router-for-me/CLIProxyAPI.git"
track = "branch:main"

[fork]
branch = "patched"

[ledger]
ignore = [".github/**", "docs/custom-fork.md"]

[[patch]]
id = "antigravity-function-call-ids"
summary = "Synthesize missing functionCall IDs for Claude models on Antigravity"
paths = ["internal/translator/antigravity/**"]
tests = ["go test ./internal/translator/antigravity/..."]

[[patch]]
id = "claude-refresh-journal"
summary = "Journal Claude OAuth refresh grants so a rotated refresh token is never lost"
paths = [
  "internal/auth/claude/**",
  "internal/auth/codex/refresh_journal.go",
  "sdk/cliproxy/auth/conductor_refresh*.go",
]
tests = ["go test ./internal/auth/claude/... ./sdk/cliproxy/auth/..."]
